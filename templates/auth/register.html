{% extends "base.html" %}

{% block title %}Daftar Akun Baru{% endblock %}

{% block guest_content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 class="auth-title">Buat Akun Baru</h2>
            <p class="auth-subtitle">Pilih peran Anda dan mulai gunakan platform</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <!-- Role Selector dihapus agar semua pendaftar default menjadi murid -->
            <input type="hidden" name="role" value="murid">

            <div class="form-group">
                <label class="form-label" for="full_name">Nama Lengkap</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="contoh: Muhammad Rizki" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label" for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="nama@email.com" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label" for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="min. 6 karakter" minlength="6" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Konfirmasi <span class="required">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="ulangi password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fas fa-user-check"></i> Selesaikan Pendaftaran
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #64748b;">
            Sudah memiliki akun? <a href="{{ url_for('login') }}" style="font-weight: 700;">Masuk di sini</a>
        </div>
    </div>
</div>
{% endblock %}
