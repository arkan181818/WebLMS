{% extends "base.html" %}

{% block title %}Masuk Akun{% endblock %}

{% block guest_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h2 class="auth-title">Masuk ke RuangBelajar</h2>
            <p class="auth-subtitle">Masukkan akun Anda untuk melanjutkan pembelajaran</p>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label class="form-label" for="identifier">Email atau Username <span class="required">*</span></label>
                <input type="text" id="identifier" name="identifier" class="form-control" placeholder="contoh: murid@sekolah.id" required autofocus>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="form-label" for="password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
                </div>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                <i class="fas fa-sign-in-alt"></i> Masuk Sekarang
            </button>
        </form>



        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: #64748b;">
            Belum punya akun? <a href="{{ url_for('register') }}" style="font-weight: 700;">Daftar Akun Baru</a>
        </div>
    </div>
</div>
{% endblock %}
